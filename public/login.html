<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión en el Sistema de Gestión de Pacientes del ASIC Miranda.">
    <title>Iniciar Sesión | ASIC Miranda</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2.25rem;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: var(--transition);
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--grad-primary);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 1.25rem;
            background: var(--grad-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px var(--primary-glow);
            color: #ffffff;
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .alert-error {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger);
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem;
            font-size: 0.88rem;
            display: none;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-wrapper .field-icon {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .input-icon-wrapper input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            outline: none;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .input-icon-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: var(--bg-surface);
        }

        .btn-toggle-pwd {
            position: absolute;
            right: 0.85rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .btn-toggle-pwd:hover {
            color: var(--text-primary);
        }

        .login-footer-info {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .credentials-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            padding: 0.4rem 0.85rem;
            border-radius: var(--radius-full);
            color: var(--accent);
            font-family: monospace;
            font-size: 0.82rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .credentials-pill:hover {
            border-color: var(--accent);
            background: rgba(6, 182, 212, 0.1);
        }

        .token-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            color: var(--success);
        }

        .theme-switch-container {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Botón de cambio de tema superior -->
    <div class="theme-switch-container">
        <button class="btn-theme-toggle" id="btn-theme-toggle" aria-label="Cambiar tema">
            <!-- Icon injected by app.js -->
        </button>
    </div>

    <div class="login-wrapper">
        <div class="login-card" id="login-container">
            <div class="login-header">
                <div class="login-brand-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                        <path d="M12 9v6M9 12h6"/>
                    </svg>
                </div>
                <h1 class="login-title">ASIC MIRANDA</h1>
                <p class="login-subtitle">Sistema de Control y Gestión de Pacientes</p>
            </div>

            <!-- Error message container -->
            <div class="alert-error" id="login-error-alert" role="alert">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="login-error-text">Credenciales incorrectas</span>
            </div>

            <form id="form-login" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label for="login-username">Usuario</label>
                    <div class="input-icon-wrapper">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="login-username" name="username" placeholder="Nombre de usuario" required autocomplete="username" autofocus>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1.75rem;">
                    <label for="login-password">Contraseña</label>
                    <div class="input-icon-wrapper">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-pwd" id="btn-toggle-pwd" onclick="togglePasswordVisibility()" aria-label="Mostrar contraseña">
                            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-login-submit" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
                    <span>Iniciar Sesión</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/app.js"></script>
    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('login-password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
            } else {
                pwdInput.type = 'password';
                eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
            }
        }

        function autoFillCredentials() {
            document.getElementById('login-username').value = 'admin';
            document.getElementById('login-password').value = 'admin';
            showToast('info', 'Relleno rápido', 'Credenciales completadas (admin / admin).');
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username');
            const passwordInput = document.getElementById('login-password');
            const submitBtn = document.getElementById('btn-login-submit');
            const errorAlert = document.getElementById('login-error-alert');
            const errorText = document.getElementById('login-error-text');

            errorAlert.style.display = 'none';

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                errorText.textContent = 'Por favor ingresa usuario y contraseña.';
                errorAlert.style.display = 'flex';
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                    <span>Verificando...</span>
                `;

                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Guardar token en localStorage como respaldo
                    if (data.token) {
                        localStorage.setItem('asic_token', data.token);
                    }
                    showToast('success', 'Bienvenido', 'Inicio de sesión exitoso. Redirigiendo...');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    errorText.textContent = data.error || 'Credenciales incorrectas.';
                    errorAlert.style.display = 'flex';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (err) {
                console.error('Error al iniciar sesión:', err);
                errorText.textContent = 'Error de conexión con el servidor.';
                errorAlert.style.display = 'flex';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <span>Iniciar Sesión</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                `;
            }
        }
    </script>
</body>
</html>
